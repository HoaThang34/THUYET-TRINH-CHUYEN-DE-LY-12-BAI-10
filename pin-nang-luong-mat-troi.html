                ctx.fillStyle = state.circuitClosed ? '#34d399' : '#fb7185';
                ctx.font = 'bold 13px Inter';
                ctx.fillText(state.circuitClosed ? 'MẠCH KÍN' : 'MẠCH HỞ: V = Voc, I = 0', x + 16, y + h - 14);
            }
            ctx.restore();
        }

        // Đường đặc tuyến J–V: điểm làm việc là cực đại công suất (mạch kín) hoặc Voc (mạch hở)
        function drawIVChart(x, y, w, h) {
            ctx.save();
            const Vmax = 0.7, Jmax = 44;
            const px = V => x + 28 + (V / Vmax) * (w - 36);
            const py = J => y + h - 22 - (J / Jmax) * (h - 32);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(px(0), py(0)); ctx.lineTo(px(Vmax), py(0));
            ctx.moveTo(px(0), py(0)); ctx.lineTo(px(0), py(Jmax));
            ctx.stroke();
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('V (V)', x + w / 2 + 10, y + h - 4);
            ctx.save();
            ctx.translate(x + 8, y + h / 2 - 6);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('J (mA/cm²)', 0, 0);
            ctx.restore();

            const cur = getLightLevel();
            ['low', 'medium', 'high'].forEach(lv => {
                const mdl = MODEL[lv];
                ctx.strokeStyle = lv === cur ? '#22d3ee' : 'rgba(148, 163, 184, 0.35)';
                ctx.lineWidth = lv === cur ? 3 : 1.5;
                ctx.beginPath();
                for (let V = 0; V <= mdl.Voc; V += 0.005) {
                    const J = cellJ(V, mdl.G);
                    if (V === 0) ctx.moveTo(px(V), py(J)); else ctx.lineTo(px(V), py(J));
                }
                ctx.stroke();
            });
            ctx.fillStyle = '#fde047';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#facc15';
            ctx.beginPath();
            ctx.arc(px(state.meter.V), py(state.meter.J), 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnergyBalanceHUD(x, y, w, h) {
            hudPanel(x, y, w, h, 'CÂN BẰNG NĂNG LƯỢNG ÁNH SÁNG TỚI (100%)', '#fde047');
            ctx.save();
            const model = MODEL[getLightLevel()];
            const elec = state.circuitClosed ? model.eff * 100 : 0;
            const therm = 33, ir = 19;
            const rest = 100 - elec - therm - ir;
            const segs = [
                [elec, '#34d399', state.circuitClosed ? `Điện năng hữu ích ≈ ${elec.toFixed(0)}%` : 'Mạch hở: 0% điện năng ra mạch ngoài'],
                [therm, '#f59e0b', 'Nhiệt do photon dư năng lượng (hν > Eg) ≈ 33%'],
                [ir, '#c2410c', 'Photon hν < Eg xuyên qua, không hấp thụ ≈ 19%'],
                [rest, '#64748b', `Phản xạ, che khuất, tái hợp, điện trở ≈ ${rest.toFixed(0)}%`]
            ];
            const bx = x + 20, bw = w - 40;
            let cx0 = bx;
            segs.forEach(s => {
                const sw = bw * s[0] / 100;
                ctx.fillStyle = s[1];
                ctx.fillRect(cx0, y + 56, sw, 40);
                cx0 += sw;
            });
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, y + 56, bw, 40);
            ctx.font = '600 15px Inter';
            ctx.textAlign = 'left';
            segs.forEach((s, i) => {
                const ly = y + 134 + i * 36;
                ctx.fillStyle = s[1];
                ctx.fillRect(x + 20, ly - 13, 16, 16);
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText(s[2], x + 46, ly);
            });
            ctx.restore();
        }

        // ==========================================
        // KHỞI CHẠY
        // ==========================================
        initParticles();
        settleLoads();
        updateCameraTargets(true);
        initCanvasSize();
        updateTimelineUI();
        updateControlButtonsUI();
        refreshLightButtons();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderFrame);
        showToast('Sẵn sàng! Nhấn PLAY để xem quá trình chuyển đổi Quang Năng → Điện Năng.');
    </script>
</body>
