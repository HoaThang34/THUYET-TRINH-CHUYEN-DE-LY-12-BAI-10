<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kính Hiển Vi Điện Tử - Mô Phỏng TEM & SEM Quan Sát Virus & Vi Khuẩn</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
        .lab-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);

            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-tech:active {
            transform: scale(0.96);
        }
        .active-mode-tem {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.45);
        }
        .active-mode-sem {
            background: linear-gradient(135deg, #059669, #047857);
            border-color: #34d399;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.45);
        }
        .active-btn {
            background-color: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }
        canvas { touch-action: none; }
    </style>
</head>
<body class="w-screen flex flex-col justify-between bg-[#030712]" style="height:100vh;height:100dvh;">

    <!-- Top Navigation & Status Bar -->

                </div>

                    PHÂN GIẢI MỤC TIÊU: 1920&times;1080 &bull; ÁP SUẤT BUỒNG: <span id="vacuumReadout" class="text-emerald-400">1.0×10⁻⁵ Pa</span>
                </p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800">

                    <i class="fa-solid fa-arrow-down-long"></i> TEM (TRUYỀN QUA)

                <button id="btnSEM" onclick="setMicroscopeMode('SEM')" class="btn-tech px-3 py-1.5 rounded-lg text-xs font-bold border border-transparent text-slate-400 hover:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-wave-square"></i> SEM (QUÉT BỀ MẶT)

            </div>

            <div class="h-6 w-[1px] bg-slate-800 hidden sm:block"></div>

    </header>

            <!-- Top-Left Scene HUD -->

                    </div>

            <!-- Top-Right Telemetry HUD -->

                </div>
                <div class="h-6 w-[1px] bg-slate-700"></div>

                    <span class="text-slate-400 text-[10px] block">ĐỘ PHÓNG ĐẠI</span>
                    <span id="hudMag" class="text-emerald-300 font-bold">50,000×</span>
                </div>
                <div class="h-6 w-[1px] bg-slate-700"></div>
                <div>
                    <span class="text-slate-400 text-[10px] block">CHẾ ĐỘ ẢNH</span>
                    <span id="hudColorMode" class="text-amber-300 font-bold">LÁT CẮT MỎNG / ĐƠN SẮC</span>
                </div>

            <!-- Virus morphology switcher (chỉ hiện ở cảnh 6) -->
            <div id="virusSubControls" class="absolute bottom-4 left-4 lab-panel p-2 rounded-xl items-center gap-2 z-10" style="display:none;">
                <span class="text-[11px] font-mono-tech text-slate-300 px-2">HÌNH THÁI VIRUS:</span>

                    CẦU CÓ GAI (CORONAVIRUS)
                </button>
                <button onclick="setVirusType('bacteriophage')" id="vType-bacteriophage" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white border border-slate-700">
                    PHỨC TẠP (THỰC KHUẨN THỂ T4)
                </button>
                <button onclick="setVirusType('rod')" id="vType-rod" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white border border-slate-700">

    </main>

    <!-- Bottom Playback & Timeline Controls -->
    <footer class="w-full px-4 py-2.5 bg-slate-950/95 border-t border-slate-800/90 z-20">
        <div class="max-w-7xl mx-auto flex flex-col gap-2">
            <div class="flex items-center gap-3">
                <span id="timeCurrent" class="text-[11px] font-mono-tech text-slate-400 w-10">00:00</span>
                <div id="timeline" class="relative flex-1 h-2.5 bg-slate-900 rounded-full border border-slate-800 cursor-pointer group" style="touch-action:none;">
                    <!-- 6 mốc chia 7 cảnh (mỗi cảnh 8s / 56s) -->
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:14.2857%"></div>
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:28.5714%"></div>
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:42.8571%"></div>
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:57.1428%"></div>
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:71.4285%"></div>
                    <div class="absolute top-0 bottom-0 w-[1px] bg-slate-600/70 pointer-events-none" style="left:85.7142%"></div>
                    <div id="timelineFill" class="h-full bg-gradient-to-r from-sky-500 via-cyan-400 to-emerald-400 rounded-full w-0 relative pointer-events-none">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-white shadow-[0_0_10px_#38bdf8] scale-90 group-hover:scale-110 transition-transform"></div>
                    </div>
                </div>
                <span id="timeTotal" class="text-[11px] font-mono-tech text-slate-400 w-10 text-right">00:56</span>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <button id="btnPlay" onclick="playSim()" class="btn-tech px-3.5 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(56,189,248,0.4)]">
                        <i class="fa-solid fa-play"></i> PLAY
                    </button>
                    <button id="btnPause" onclick="pauseSim()" class="btn-tech px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs border border-slate-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-pause"></i> PAUSE
                    </button>
                    <button id="btnReplay" onclick="replaySim()" class="btn-tech px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs border border-slate-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-left"></i> REPLAY
                    </button>
                </div>

                <div class="hidden lg:flex items-center gap-1">
                    <button onclick="jumpToScene(1)" id="pill-1" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-sky-500/20 text-sky-300 border border-sky-500/40">1. CỘT KÍNH</button>
                    <button onclick="jumpToScene(2)" id="pill-2" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">2. CHÂN KHÔNG</button>
                    <button onclick="jumpToScene(3)" id="pill-3" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">3. CHÙM ELECTRON</button>
                    <button onclick="jumpToScene(4)" id="pill-4" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">4. TƯƠNG TÁC MẪU</button>
                    <button onclick="jumpToScene(5)" id="pill-5" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">5. VI KHUẨN</button>
                    <button onclick="jumpToScene(6)" id="pill-6" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">6. VIRUS</button>
                    <button onclick="jumpToScene(7)" id="pill-7" class="scene-pill px-2.5 py-1 rounded text-[11px] font-mono-tech bg-slate-900 text-slate-400 hover:text-white border border-slate-800">7. MÀN HÌNH ẢNH</button>
                </div>

                <div class="flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">
                    <span class="text-[11px] font-mono-tech text-slate-400"><i class="fa-solid fa-gauge-high text-sky-400 mr-1"></i>SPEED:</span>
                    <button onclick="setSpeed(0.5)" id="spd-0.5" class="spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech text-slate-400 hover:text-white">0.5x</button>
                    <button onclick="setSpeed(1)" id="spd-1" class="spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech bg-sky-500/20 text-sky-300 font-bold">1.0x</button>
                    <button onclick="setSpeed(1.5)" id="spd-1.5" class="spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech text-slate-400 hover:text-white">1.5x</button>
                    <button onclick="setSpeed(2)" id="spd-2" class="spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech text-slate-400 hover:text-white">2.0x</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Polyfill cho trình duyệt cũ chưa có ctx.roundRect
        if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (Array.isArray(r)) r = r[0] || 0;
                r = Math.min(r || 0, w / 2, h / 2);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 1920;
        const HEIGHT = 1080;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // ---------- Tiện ích ----------
        const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        function piecewise(pts, y) {
            if (y <= pts[0][0]) return pts[0][1];
            for (let i = 1; i < pts.length; i++) {
                if (y <= pts[i][0]) {
                    const [y0, h0] = pts[i - 1];
                    const [y1, h1] = pts[i];
                    return lerp(h0, h1, (y - y0) / (y1 - y0));
                }
            }
            return pts[pts.length - 1][1];
        }
        function fmtPa(pa) {
            let e = Math.floor(Math.log10(pa));
            let m = pa / Math.pow(10, e);
            if (m.toFixed(1) === '10.0') { m = 1; e += 1; }
            const sup = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
            return `${m.toFixed(1)}×10${String(e).split('').map(c => sup[c]).join('')}`;
        }

        // ---------- Lịch cảnh (tổng 56 giây) ----------
        const SCENES = [
            { id: 1, start: 0,  end: 8,  tag: "CẢNH 1 / 7 • CẤU TRÚC THIẾT BỊ", title: "TOÀN CẢNH KÍNH HIỂN VI ĐIỆN TỬ" },
            { id: 2, start: 8,  end: 16, tag: "CẢNH 2 / 7 • NẠP MẪU QUA CỬA KHÓA KHÍ & HÚT CHÂN KHÔNG", title: "NẠP MẪU VẬT & TẠO MÔI TRƯỜNG CHÂN KHÔNG CAO" },
            { id: 3, start: 16, end: 24, tag: "CẢNH 3 / 7 • GIA TỐC & HỘI TỤ CHÙM TIA", title: "PHÁT CHÙM ELECTRON & THẤU KÍNH ĐIỆN TỪ" },
            { id: 4, start: 24, end: 32, tag: "CẢNH 4 / 7 • TƯƠNG TÁC VẬT CHẤT", title: "TƯƠNG TÁC ELECTRON VỚI MẪU & ĐẦU DÒ TÍN HIỆU" },
            { id: 5, start: 32, end: 40, tag: "CẢNH 5 / 7 • CẤU TRÚC VI SINH VẬT", title: "QUAN SÁT TẾ BÀO VI KHUẨN (E. COLI)" },
            { id: 6, start: 40, end: 48, tag: "CẢNH 6 / 7 • CẤU TRÚC SIÊU HIỂN VI", title: "QUAN SÁT CẤU TRÚC HẠT VIRUS" },
            { id: 7, start: 48, end: 56, tag: "CẢNH 7 / 7 • TÁI TẠO HÌNH ẢNH SỐ", title: "MÀN HÌNH HIỂN THỊ ẢNH HIỂN VI ĐIỆN TỬ" }
        ];

        // Cấu hình HUD theo chế độ & cảnh
        const HUD = {
            TEM: { kv: '200.0 kV', color: 'LÁT CẮT MỎNG / ĐƠN SẮC', mags: { def: '50,000×', 5: '25,000×', 6: '200,000×', 7: '25,000× / 200,000×' } },
            SEM: { kv: '15.0 kV',  color: 'BỀ MẶT 3D / MÀU GIẢ LẬP', mags: { def: '10,000×', 5: '20,000×', 6: '100,000×', 7: '20,000× / 100,000×' } }
        };

        // ---------- Trạng thái ----------
        const state = {
            isPlaying: true,
            autoMode: true,
            loopScene: null,
            time: 0,
            totalDuration: 56,
            speed: 1.0,
            mode: 'TEM',
            currentScene: 1,
            virusType: 'spherical',
            airMolecules: [],
            electrons: [],
            secondarySignals: []
        };

        // Hình học buồng chân không (cảnh 2)
        const S2 = { cx: 960, cy: 560, w: 520, h: 380 };

        function initAirMolecules() {
            state.airMolecules = [];
            const loX = S2.cx - S2.w / 2 + 12, hiX = S2.cx + S2.w / 2 - 12;
            const loY = S2.cy - S2.h / 2 + 12, hiY = S2.cy + S2.h / 2 - 12;
            for (let i = 0; i < 90; i++) {
                state.airMolecules.push({
                    x0: loX + Math.random() * (hiX - loX),
                    y0: loY + Math.random() * (hiY - loY),
                    vx: (Math.random() - 0.5) * 140,
                    vy: (Math.random() - 0.5) * 140,
                    r: 2.5 + Math.random() * 2.5,
                    delay: Math.pow(Math.random(), 1.8), // phần lớn phân tử bị hút sớm → áp suất giảm nhanh lúc đầu
                    dur: 1.3 + Math.random() * 0.2
                });
            }
        }
        function initElectrons() {
            state.electrons = [];
            for (let i = 0; i < 110; i++) {
                state.electrons.push({
                    progress: Math.random(),
                    offset: (Math.random() - 0.5) * 2,
                    speed: 0.7 + Math.random() * 0.3
                });
            }
        }
        function initSignals() {
            state.secondarySignals = [];
            for (let i = 0; i < 60; i++) {
                state.secondarySignals.push({
                    t: Math.random(),
                    speed: 0.6 + Math.random() * 0.5,
                    scatterX: (Math.random() - 0.5) * 140,
                    ox: undefined, oy: undefined
                });
            }
        }
        initAirMolecules();
        initElectrons();
        initSignals();

        // ---------- Co giãn khung 16:9 ----------
        function fitStage() {
            const main = document.getElementById('stageMain');
            const wrap = document.getElementById('canvasWrapper');
            const cs = getComputedStyle(main);
            const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            const w = Math.max(320, Math.min(availW, availH * 16 / 9, 1720));
            wrap.style.width = w + 'px';
            wrap.style.height = (w * 9 / 16) + 'px';
        }
        window.addEventListener('resize', fitStage);
        if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitStage).observe(document.getElementById('stageMain'));

        // ==================== ĐIỀU KHIỂN GIAO DIỆN ====================
        function playSim() {
            if (state.time >= state.totalDuration - 0.02) state.time = 0;
            state.isPlaying = true;
            updatePlayPauseUI();
        }
        function pauseSim() {
            state.isPlaying = false;
            updatePlayPauseUI();
        }
        function replaySim() {
            state.time = 0;
            state.isPlaying = true;
            state.autoMode = true;
            state.loopScene = null;
            updatePlayPauseUI();
            updateAutoUI();
            syncSceneUI();
        }
        function setSpeed(spd) {
            state.speed = spd;
            document.querySelectorAll('.spd-btn').forEach(btn => {
                btn.className = "spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech text-slate-400 hover:text-white";
            });
            const activeBtn = document.getElementById(`spd-${spd}`);
            if (activeBtn) activeBtn.className = "spd-btn px-2 py-0.5 rounded text-[11px] font-mono-tech bg-sky-500/20 text-sky-300 font-bold";
        }

        function setMicroscopeMode(mode) {
            state.mode = mode;
            const btnTEM = document.getElementById('btnTEM');
            const btnSEM = document.getElementById('btnSEM');
            const badge = document.getElementById('badgeMode');
            if (mode === 'TEM') {
                btnTEM.className = "btn-tech px-3 py-1.5 rounded-lg text-xs font-bold border border-transparent active-mode-tem flex items-center gap-1.5";
                btnSEM.className = "btn-tech px-3 py-1.5 rounded-lg text-xs font-bold border border-transparent text-slate-400 hover:text-white flex items-center gap-1.5";
                badge.innerText = "TEM MODE (TRUYỀN QUA)";
                badge.className = "px-2 py-0.5 text-[10px] font-mono-tech font-bold rounded bg-sky-500/20 text-sky-400 border border-sky-500/40";
            } else {
                btnSEM.className = "btn-tech px-3 py-1.5 rounded-lg text-xs font-bold border border-transparent active-mode-sem flex items-center gap-1.5";

        // Đồng bộ HUD theo chế độ + cảnh (độ phóng đại thay đổi theo đối tượng quan sát)
        function updateHUD() {
            const cfg = HUD[state.mode];
            document.getElementById('hudVoltage').innerText = cfg.kv;
            document.getElementById('hudMag').innerText = cfg.mags[state.currentScene] || cfg.mags.def;
            document.getElementById('hudColorMode').innerText = cfg.color;
            if (state.currentScene !== 2) {
                // Ngoài cảnh 2, cột kính luôn ở chân không cao
                document.getElementById('vacuumReadout').innerText = '1.0×10⁻⁵ Pa';
            }
        }

        function jumpToScene(sceneId) {
            const target = SCENES.find(s => s.id === sceneId);
            if (!target) return;
            state.time = target.start + 0.05;
            state.isPlaying = true;
            // Chuyển sang chế độ thủ công: lặp lại cảnh đang chọn để người dùng quan sát/đổi TEM–SEM, loại virus
            state.autoMode = false;
            state.loopScene = sceneId;
            updatePlayPauseUI();
            updateAutoUI();
            syncSceneUI();
        }
        function enableAutoMode() {
            state.autoMode = true;
            state.loopScene = null;
            state.isPlaying = true;
            updateAutoUI();
            updatePlayPauseUI();
        }
        function setVirusType(type) {
            state.virusType = type;
            ['spherical', 'bacteriophage', 'rod'].forEach(t => {
                const el = document.getElementById(`vType-${t}`);
                el.className = (t === type)
                    ? "px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-500/30 text-rose-200 border border-rose-400/50"
                    : "px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white border border-slate-700";
            });
        }

        // Tua timeline bằng con trỏ (chuột / cảm ứng / bút), kéo thả được
        const timelineEl = document.getElementById('timeline');
        let scrubbing = false;
        function scrubAt(clientX) {
            const rect = timelineEl.getBoundingClientRect();
            const ratio = clamp((clientX - rect.left) / rect.width);
            state.time = Math.min(ratio * state.totalDuration, state.totalDuration - 0.01);
            state.autoMode = true;
            state.loopScene = null;
            updateAutoUI();
            syncSceneUI();
        }
        timelineEl.addEventListener('pointerdown', e => {
            scrubbing = true;
            try { timelineEl.setPointerCapture(e.pointerId); } catch (err) {}
            scrubAt(e.clientX);
        });
        timelineEl.addEventListener('pointermove', e => { if (scrubbing) scrubAt(e.clientX); });
        const endScrub = () => { scrubbing = false; };
        timelineEl.addEventListener('pointerup', endScrub);
        timelineEl.addEventListener('pointercancel', endScrub);

        function updatePlayPauseUI() {
            const btnPlay = document.getElementById('btnPlay');
            const btnPause = document.getElementById('btnPause');
            if (state.isPlaying) {
                btnPlay.className = "btn-tech px-3.5 py-1.5 rounded-lg bg-sky-500 text-slate-950 font-bold text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(56,189,248,0.4)]";

        function updateAutoUI() {

        function formatTime(sec) {
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const current = SCENES.find(s => state.time >= s.start && state.time < s.end) || SCENES[SCENES.length - 1];

            bgGrad.addColorStop(0, '#0b162c');

        function drawCalloutLabel(x, y, targetX, targetY, title, subtitle, color = '#38bdf8', active = true) {
            ctx.save();
            ctx.globalAlpha = active ? 1.0 : 0.35;

            ctx.strokeStyle = color;
            ctx.lineWidth = active ? 2.5 : 1.5;
            ctx.beginPath();
            ctx.moveTo(targetX, targetY);
            const midX = targetX + (x > targetX ? 45 : -45);
            ctx.lineTo(midX, y);
            ctx.lineTo(x, y);
            ctx.stroke();

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(targetX, targetY, active ? 5 : 3.5, 0, Math.PI * 2);
            ctx.fill();

            if (active) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(targetX, targetY, 9, 0, Math.PI * 2);
                ctx.strokeStyle = color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            const alignLeft = x > targetX;
            ctx.textAlign = alignLeft ? 'left' : 'right';
            const textX = alignLeft ? x + 12 : x - 12;

            ctx.font = 'bold 18px "Inter", sans-serif';
            ctx.fillStyle = active ? '#ffffff' : '#94a3b8';
            ctx.fillText(title, textX, y - 4);

            ctx.font = '500 14px "JetBrains Mono", monospace';
            ctx.fillStyle = active ? color : '#64748b';
            ctx.fillText(subtitle, textX, y + 17);
            ctx.restore();
        }

            drawCalloutLabel(520, 320, colX - 105, 320, "2. THẤU KÍNH ĐIỆN TỪ", "Cuộn dây từ trường hội tụ chùm tia", '#38bdf8', highlightIdx === 1);
