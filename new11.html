        function renderScene4(p, dt) {
            const region = state.examRegion;
            const cx = 960;

            // Nguồn tia (cách đầu thu ~180 cm, vẽ không đúng tỉ lệ)
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.roundRect(cx - 80, 40, 160, 56, 16);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(cx - 30, 96, 60, 14);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(cx - 30, 110); ctx.lineTo(cx - 320, S4.rayTop);
            ctx.moveTo(cx + 30, 110); ctx.lineTo(cx + 320, S4.rayTop);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.font = '600 13px "JetBrains Mono", monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'left';
            ctx.fillText('~180 cm tới đầu thu (không đúng tỉ lệ)', cx + 100, 80);

            if (region === 'CHEST') drawChestSection(); else drawHandSection();

            // Đường tia: độ sáng giảm dần theo e^(−τ) khi đi qua mô
            ctx.lineWidth = 1.5;
            state.rays.forEach(ray => {
                for (let i = 0; i < ray.taus.length - 2; i += 2) {
                    const y0 = S4.rayTop + i * 4, y1 = S4.rayTop + (i + 2) * 4;
                    const a = 0.07 + 0.38 * Math.exp(-ray.taus[i]);
                    ctx.strokeStyle = `rgba(125, 211, 252, ${a})`;
                    ctx.beginPath();
                    ctx.moveTo(rayX(ray.normX, y0), y0);
                    ctx.lineTo(rayX(ray.normX, y1), y1);
                    ctx.stroke();
                }
            });

            // Photon: mỗi photon bị hấp thụ/tán xạ tại độ sâu mà tích phân μ vượt ngưỡng ngẫu nhiên (Beer–Lambert)
            const pPEbone = region === 'CHEST' ? 0.55 : 0.85;
            const pPEsoft = region === 'CHEST' ? 0.1 : 0.3;
            state.rays.forEach(ray => {
                ray.photons.forEach(ph => {
                    ph.ph += ph.speed * dt;
                    if (ph.ph > 1) { ph.ph -= 1; newPhoton(ray, ph); }
                    const y = S4.rayTop + ph.ph * (S4.detY - S4.rayTop);
                    const x = rayX(ray.normX, y);
                    if (ph.ya !== null && y >= ph.ya) {
                        if (!ph.hit) {
                            ph.hit = true;
                            const bone = muAt(region, x, ph.ya) > (region === 'CHEST' ? 0.02 : 0.04);
                            const photo = Math.random() < (bone ? pPEbone : pPEsoft);
                            if (photo) addSpark(x, ph.ya, '#fbbf24', 14);     // hiệu ứng quang điện: hấp thụ hoàn toàn
                            else {                                              // tán xạ Compton: photon đổi hướng
                                addSpark(x, ph.ya, '#c4b5fd', 12);
                                if (state.scattered.length < 70) {
                                    const ang = Math.random() < 0.5 ? Math.PI / 2 + (Math.random() - 0.5) * 1.2 : Math.random() * Math.PI * 2;
                                    state.scattered.push({ x, y: ph.ya, ang, life: 2.2 });
                                }
                            }
                        }
                    } else {
                        drawXrayWavePhoton(x, y, Math.PI / 2 - Math.atan(ray.normX * 0.065), '#7dd3fc', 0.95);
                    }
                });
            });

            // Tia tán xạ: lưới chống tán xạ chặn tia đi chéo
            for (let i = state.scattered.length - 1; i >= 0; i--) {
                const s = state.scattered[i];
                s.x += Math.cos(s.ang) * 240 * dt;
                s.y += Math.sin(s.ang) * 240 * dt;
                s.life -= dt;
                let remove = s.life <= 0 || s.y < 150 || s.x < 300 || s.x > 1620;
                if (!remove && s.y >= S4.gridY && !s.checked) {
                    s.checked = true;
                    const oblique = Math.abs(Math.cos(s.ang) / Math.max(0.05, Math.abs(Math.sin(s.ang)))) > 0.14 || Math.sin(s.ang) <= 0;
                    if (oblique) { addSpark(s.x, S4.gridY + 6, '#94a3b8', 8); remove = true; }
                }
                if (!remove && s.y > S4.detY + 6) remove = true;
                if (remove) { state.scattered.splice(i, 1); continue; }
                drawXrayWavePhoton(s.x, s.y, s.ang, '#c4b5fd', 0.7);
            }
            updateSparks(dt);
            drawSparks();

            // Lưới chống tán xạ + đầu thu FPD
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            for (let gx = cx - 370; gx <= cx + 370; gx += 14) {
                ctx.beginPath();
                ctx.moveTo(gx, S4.gridY);
                ctx.lineTo(gx, S4.gridY + 28);
                ctx.stroke();
            }
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(cx - 380, S4.detY, 760, 36, 8);
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Biểu đồ cường độ I/I₀ tại đầu thu (theo vị trí ngang)
            const px0 = cx - 380, pw = 760, baseY = 935, ph = 110;
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(px0, baseY - ph - 6); ctx.lineTo(px0, baseY); ctx.lineTo(px0 + pw, baseY);
            ctx.stroke();
            ctx.beginPath();
            state.rays.forEach((ray, i) => {
                const x = rayX(ray.normX, S4.detY);
                const y = baseY - Math.exp(-ray.total) * ph * 1.0;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.font = '600 13px "JetBrains Mono", monospace';
            ctx.fillStyle = '#34d399';
            ctx.textAlign = 'left';
            ctx.fillText('I/I₀ tại đầu thu (lượng tia tới mỗi vị trí)', px0 + 8, baseY - ph - 10);

            // Chú thích bám đúng cấu trúc
            if (region === 'CHEST') {
                drawCallout(1440, 290, S4.bcx, S4.bcy - 112, "XƯƠNG (cột sống, sườn, ức)", "μ lớn → ít tia tới đầu thu", '#e2e8f0');
                drawCallout(1440, 560, S4.bcx + 60, S4.bcy + 55, "TIM / MÔ MỀM", "μ trung bình → tín hiệu trung bình", '#fb7185');
                drawCallout(480, 500, S4.bcx - 150, S4.bcy - 10, "PHỔI (chứa khí)", "μ rất nhỏ → nhiều tia tới đầu thu", '#38bdf8');
            } else {
                drawCallout(1440, 330, S4.bcx + 75, S4.bcy, "XƯƠNG BÀN TAY", "μ lớn → ít tia tới đầu thu", '#e2e8f0');
                drawCallout(480, 540, S4.bcx - 40, S4.bcy + 28, "MÔ MỀM", "μ trung bình → tín hiệu trung bình", '#94a3b8');
                drawCallout(1440, 440, S4.bcx + 260, S4.bcy, "KHÔNG KHÍ (ngoài bàn tay)", "Không suy giảm → tín hiệu cực đại", '#38bdf8');
            }
            drawCallout(1440, 702, cx + 330, S4.gridY + 14, "LƯỚI CHỐNG TÁN XẠ", "Lá chì chặn tia Compton đi chéo", '#c4b5fd');
            drawCallout(1440, 760, cx + 360, S4.detY + 18, "ĐẦU THU FPD", "Ghi lượng tia còn lại sau suy giảm", '#34d399');
        }

        // ==================== CẢNH 5: ĐẦU THU FPD & TẠO ẢNH SỐ ====================
        function drawFPDCrossSection(x, y, w, h, sigCols) {
            const t = state.time;
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 18);
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.fillStyle = '#34d399';
            ctx.textAlign = 'left';
            ctx.fillText("FPD GIÁN TIẾP — MẶT CẮT", x + 16, y + 30);

            const ix = x + 20, iw = w - 40;
            const yCover = y + 120, yCsI = yCover + 16, csiH = 170;
            const yPD = yCsI + csiH, pdH = 80, ySub = yPD + pdH, yRead = ySub + 24;
            const cw = iw / 6;

            ctx.font = '600 13px "Inter", sans-serif';
            ctx.fillStyle = '#7dd3fc';
            ctx.fillText('Tia X đã xuyên qua bệnh nhân ↓', ix, y + 70);

            ctx.fillStyle = '#475569';
            ctx.fillRect(ix, yCover, iw, 16);
            const csiGrad = ctx.createLinearGradient(0, yCsI, 0, yPD);
            csiGrad.addColorStop(0, 'rgba(190, 242, 100, 0.16)');
            csiGrad.addColorStop(1, 'rgba(190, 242, 100, 0.06)');
            ctx.fillStyle = csiGrad;
            ctx.fillRect(ix, yCsI, iw, csiH);
            ctx.strokeStyle = 'rgba(217, 249, 157, 0.35)';
            ctx.lineWidth = 1.5;
            for (let nx = ix + 4; nx < ix + iw; nx += 7) {
                ctx.beginPath();
                ctx.moveTo(nx, yCsI);
                ctx.lineTo(nx, yPD);
                ctx.stroke();
            }
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(ix, yPD, iw, pdH);
            ctx.fillStyle = '#334155';
            ctx.fillRect(ix, ySub, iw, 24);
            ctx.fillStyle = '#312e81';
            ctx.fillRect(ix, yRead, iw, 38);

            ctx.font = '600 13px "Inter", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#e2e8f0';
            ctx.fillText('Vỏ carbon', ix + 8, yCover + 12);
            ctx.fillStyle = '#d9f99d';
            ctx.fillText('CsI(Tl): tia X → ánh sáng xanh lục', ix + 8, yCsI + 20);
            ctx.fillStyle = '#bfdbfe';
            ctx.fillText('a-Si:H photodiode: ánh sáng → điện tích', ix + 8, yPD - 6 + 0);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('Đế thủy tinh', ix + 8, ySub + 17);
            ctx.fillStyle = '#c7d2fe';
            ctx.fillText('TFT + mạch đọc', ix + 8, yRead + 24);

            for (let k = 0; k < 6; k++) {
                const cxk = ix + cw * (k + 0.5);
                const sg = sigCols[k];
                // giếng điện tích của điểm ảnh
                const wx = ix + cw * k + 6, wy = yPD + 12, ww = cw - 12, wh = pdH - 20;
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(wx, wy, ww, wh);
                const fillH = wh * clamp(sg) * 0.95;
                ctx.fillStyle = 'rgba(34, 211, 238, 0.65)';
                ctx.fillRect(wx, wy + wh - fillH, ww, fillH);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(wx, wy, ww, wh);

                // Chuỗi sự kiện: tia X → ánh sáng → điện tích; số photon ∝ tín hiệu
                const nPh = Math.max(1, Math.round(sg * 4));
                for (let j = 0; j < nPh; j++) {
                    const ph = (t * 0.55 + j / nPh + k * 0.13) % 1;
                    const yc = yCsI + 40 + ((k * 37 + j * 53) % 100);
                    if (ph < 0.45) {
                        const yy = lerp(y + 80, yc, ph / 0.45);
                        drawXrayWavePhoton(cxk + (j - nPh / 2) * 6, yy, Math.PI / 2, '#38bdf8', 1);
                    } else if (ph < 0.9) {
                        const q = (ph - 0.45) / 0.45;
                        if (q < 0.2) {
                            ctx.strokeStyle = `rgba(134, 239, 172, ${1 - q / 0.2})`;
                            ctx.lineWidth = 2.5;
                            ctx.beginPath();
                            ctx.arc(cxk + (j - nPh / 2) * 6, yc, 4 + q * 60, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        for (let d = 0; d < 3; d++) {
                            const dx = (d - 1) * 8 * q;
                            ctx.fillStyle = '#86efac';
                            ctx.beginPath();
                            ctx.arc(cxk + (j - nPh / 2) * 6 + dx, lerp(yc, yPD + 12, q), 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else {
                        ctx.fillStyle = '#22d3ee';
                        ctx.beginPath();
                        ctx.arc(cxk + (j - nPh / 2) * 5, wy + wh - 6 - (j % 3) * 7, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ctx.font = '500 14px "Inter", sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.textAlign = 'left';
            const steps = [
                '① Tia X → ánh sáng xanh (scintillator CsI).',
                '② Ánh sáng → điện tích trong photodiode a-Si.',
                '③ TFT bật từng hàng để đọc điện tích.',
                '④ ADC số hóa thành giá trị 14 bit.'
            ];
            steps.forEach((s, i) => ctx.fillText(s, ix, yRead + 70 + i * 26));
        }

        function renderScene5(p) {
            const R = RADIO[state.examRegion];
            const sig = R.sig;
            const t = state.time;
            const cy = 170;

            const rp = clamp((p - 0.2) / 0.62);             // tiến độ đọc từng hàng
            const rowsRead = rp * 10;
            const curRow = Math.min(9, Math.floor(rowsRead));
            const sigCols = [0, 2, 4, 5, 7, 9].map(c => sig[5][c]);

            // Panel A: mặt cắt FPD
            drawFPDCrossSection(50, cy, 420, 720, sigCols);

            // Panel B: ma trận điểm ảnh 10×10
            const bx = 510, bw = 400, by = cy;
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, 720, 18);
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.fillStyle = '#34d399';
            ctx.textAlign = 'left';
            ctx.fillText("MA TRẬN ĐIỂM ẢNH 10×10", bx + 16, by + 30);

            const cell = 36, gx = bx + 20, gy = by + 70;
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const s = sig[r][c];
                    const done = r < curRow || rp >= 1;
                    const alpha = done ? 0.12 : s * (0.85 + Math.sin(t * 6 + r + c) * 0.08);
                    ctx.fillStyle = `rgba(52, 211, 153, ${clamp(alpha, 0.05, 1)})`;
                    ctx.fillRect(gx + c * cell + 1, gy + r * cell + 1, cell - 2, cell - 2);
                }
            }
            if (rp > 0 && rp < 1) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(gx - 2, gy + curRow * cell, cell * 10 + 4, cell);
                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 13px "JetBrains Mono", monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`hàng ${curRow + 1}/10 ▶`, gx - 6, gy + curRow * cell + 22);
                ctx.textAlign = 'left';
            }
            ctx.font = '500 14px "Inter", sans-serif';
            ctx.fillStyle = '#cbd5e1';
            wrapLines('Tín hiệu mỗi điểm ảnh ∝ số photon tới: vùng khí sáng (nhiều tia), xương tối (ít tia). Hàng đã đọc được xóa điện tích.', bw - 40).forEach((ln, i) => ctx.fillText(ln, bx + 20, gy + 380 + i * 22));
            ctx.font = 'bold 13px "JetBrains Mono", monospace';
            ctx.fillStyle = '#7dd3fc';
            ctx.fillText("MỨC XÁM ĐẦU THU (trước khi đảo cực)", bx + 20, gy + 372 - 4 + 0);

            // ADC
            const ax = 925, ay = 400, aw = 160, ah = 130;
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(bx + bw, ay + ah / 2);
            ctx.lineTo(ax, ay + ah / 2);
            ctx.moveTo(ax + aw, ay + ah / 2);
            ctx.lineTo(1110, ay + ah / 2);
            ctx.stroke();
            ctx.fillStyle = '#1d4ed8';
            ctx.beginPath();
            ctx.roundRect(ax, ay, aw, ah, 12);
            ctx.fill();
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('ADC 14 bit', ax + aw / 2, ay + 40);
            const col = Math.floor(t * 14) % 10;
            const val = Math.floor(clamp(sig[curRow][col]) * 16383);
            ctx.font = 'bold 22px "JetBrains Mono", monospace';
            ctx.fillStyle = '#bfdbfe';
            ctx.fillText(rp > 0 ? String(val).padStart(5, '0') : '-----', ax + aw / 2, ay + 82);
            ctx.font = '12px "JetBrains Mono", monospace';
            ctx.fillStyle = '#93c5fd';
            ctx.fillText('số hóa tín hiệu', ax + aw / 2, ay + 108);
            for (let i = 0; i < 4; i++) {
                const q = ((t * 0.9 + i / 4) % 1);
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(bx + bw + q * (ax - bx - bw), ay + ah / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Panel C: ảnh được dựng dần theo từng hàng đọc, sau đó đảo cực
            const cx0 = 1110, cw0 = 750;
            ctx.fillStyle = '#020617';
            ctx.beginPath();
            ctx.roundRect(cx0, cy, cw0, 720, 18);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.fillStyle = '#38bdf8';
            ctx.textAlign = 'left';
            ctx.fillText("TÁI TẠO ẢNH (XỬ LÝ SỐ)", cx0 + 16, cy + 30);

            const imgS = 600, imgX = cx0 + (cw0 - imgS) / 2, imgY = cy + 60;
            const inv = ease(clamp((p - 0.84) / 0.12));
            ctx.save();
            ctx.beginPath();
            ctx.rect(imgX, imgY, imgS, imgS * rp);
            ctx.clip();
            ctx.globalAlpha = 1 - inv;
            ctx.drawImage(R.neg, imgX, imgY, imgS, imgS);
            ctx.globalAlpha = inv;
            ctx.drawImage(R.pos, imgX, imgY, imgS, imgS);
            ctx.restore();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.strokeRect(imgX, imgY, imgS, imgS);
            if (rp > 0 && rp < 1) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(imgX, imgY + imgS * rp);
                ctx.lineTo(imgX + imgS, imgY + imgS * rp);
                ctx.stroke();
            }
            ctx.font = 'bold 14px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = inv > 0.5 ? '#f8fafc' : '#fbbf24';
            ctx.fillText(inv > 0.5 ? 'ĐÃ ĐẢO CỰC + CHỈNH ĐỘ TƯƠNG PHẢN: xương trắng, khí đen' : 'ẢNH THÔ: tín hiệu ∝ liều (khí sáng, xương tối)', cx0 + cw0 / 2, imgY + imgS + 32);
        }

        // ==================== CẢNH 6: ẢNH X-QUANG PHÓNG TO ====================
        function renderScene6(p) {
            const cx = WIDTH / 2, cy = HEIGHT / 2 - 10;
            const frameW = 920, frameH = 760;
            const R = RADIO[state.examRegion];
            const chest = state.examRegion === 'CHEST';

            ctx.fillStyle = '#020617';
            ctx.beginPath();
            ctx.roundRect(cx - frameW / 2, cy - frameH / 2, frameW, frameH, 16);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.stroke();

            const imgS = 680, imgX = cx - imgS / 2, imgY = cy - imgS / 2 + 10;
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(cx - frameW / 2 + 16, cy - frameH / 2 + 16, frameW - 32, frameH - 32, 10);
            ctx.clip();
            ctx.drawImage(R.pos, imgX, imgY, imgS, imgS);
            // quét hiện ảnh từ trên xuống
            const sweepY = imgY + Math.min(1, p * 1.4) * imgS;
            if (p < 0.72) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.82)';
                ctx.fillRect(imgX, sweepY, imgS, imgY + imgS - sweepY);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(imgX, sweepY);
                ctx.lineTo(imgX + imgS, sweepY);
                ctx.stroke();
            }
            ctx.restore();

            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.fillStyle = '#e2e8f0';
            ctx.textAlign = 'left';
            ctx.fillText(`STUDY: ${chest ? 'CHEST PA ERECT' : 'HAND PA'}`, cx - frameW / 2 + 34, cy - frameH / 2 + 44);
            ctx.font = '13px "JetBrains Mono", monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(`TECHNIQUE: ${KV[state.examRegion]} kVp / ${MAS[state.examRegion]} mAs`, cx - frameW / 2 + 34, cy - frameH / 2 + 66);

            // Toạ độ giải phẫu (gốc ở giữa ảnh 640×640) → toạ độ thế giới
            const s = imgS / 640;
            const tw = (ax, ay) => ({ x: cx + ax * s, y: imgY + imgS / 2 + ay * s });
            const labelX = cx + frameW / 2 + 70;
            if (chest) {
                const bone = tw(146, -71), lung = tw(-120, -20), soft = tw(32, 55);
                drawCallout(labelX, 320, bone.x, bone.y, "XƯƠNG SƯỜN (cản tia mạnh)", "Hiển thị TRẮNG SÁNG trên ảnh X-quang", '#f8fafc');
                drawCallout(labelX, 470, soft.x, soft.y, "TIM / MÔ MỀM (cản tia vừa)", "Hiển thị sắc độ XÁM trung gian", '#fb7185');
                drawCallout(labelX, 620, lung.x, lung.y, "PHỔI CHỨA KHÍ (thấu tia)", "Hiển thị ĐEN do nhiều tia tới đầu thu", '#38bdf8');
            } else {
                const bone = tw(-2, -54), soft = tw(-30, 100), air = tw(200, -120);
                drawCallout(labelX, 320, bone.x, bone.y, "XƯƠNG ĐỐT NGÓN (cản tia mạnh)", "Hiển thị TRẮNG SÁNG trên ảnh X-quang", '#f8fafc');
                drawCallout(labelX, 470, soft.x, soft.y, "MÔ MỀM (cản tia vừa)", "Hiển thị sắc độ XÁM trung gian", '#94a3b8');
                drawCallout(labelX, 620, air.x, air.y, "NỀN / KHÔNG KHÍ (thấu tia)", "Hiển thị ĐEN do tia tới đầu thu không bị cản", '#38bdf8');
            }
        }

        // ==================== HUD MÀN HÌNH (không bị zoom) ====================
        function getCaption(scene) {
            const chest = state.examRegion === 'CHEST';
            switch (scene) {
                case 1: return chest
                    ? 'Chụp ngực thẳng (PA): bệnh nhân đứng, ngực áp sát tấm thu trên giá đứng, tia đi từ lưng ra ngực theo phương ngang. Đèn chuẩn trực (ánh sáng thường, không phải tia X) chỉ rõ vùng sẽ chiếu. Kỹ thuật viên ra phòng điều khiển, đứng sau kính chì rồi mới phát tia.'
                    : 'Chụp bàn tay (PA): bệnh nhân ngồi cạnh bàn, úp lòng bàn tay lên mặt bàn phía trên tấm thu FPD. Đèn chuẩn trực (ánh sáng thường, không phải tia X) rọi vùng sẽ chiếu. Kỹ thuật viên ra phòng điều khiển, đứng sau kính chì rồi mới phát tia.';
                case 2: return 'Bên trong bóng phát: catốt có dây tóc nung nóng, anốt quay mang bia vonfram, tất cả nằm trong vỏ thủy tinh chân không. Vỏ chì và dầu cách điện bao ngoài; tia X chỉ thoát qua cửa sổ, qua lọc nhôm và bộ chuẩn trực.';
                case 3: return `Dây tóc (mA) phát electron; hiệu điện thế ${KV[state.examRegion]} kVp gia tốc chúng tới bia vonfram. Electron bị hãm đột ngột → bức xạ hãm (phổ liên tục)${KV[state.examRegion] >= K_EDGE_W ? ' và tia đặc trưng K' : '; ở kVp thấp này không có tia đặc trưng K'}. Chỉ ~1% năng lượng thành tia X, ~99% thành nhiệt. (Thực tế phơi sáng chỉ vài chục ms; mô phỏng kéo dài để quan sát.)`;
                case 4: return 'Tia X đi qua cơ thể bị suy giảm theo định luật Beer–Lambert: xương (μ lớn) hấp thụ mạnh nhờ hiệu ứng quang điện, mô mềm vừa phải, phổi chứa khí hấp thụ rất ít. Tia tán xạ Compton bị lưới chống tán xạ chặn lại. Lượng tia còn lại tới đầu thu quyết định độ sáng tối của ảnh.';
                case 5: return 'Tia X đã tắt, hệ thống đọc dữ liệu: scintillator CsI(Tl) đổi tia X thành ánh sáng xanh, photodiode a-Si đổi ánh sáng thành điện tích, TFT đọc từng hàng, ADC số hóa. Vùng nhận nhiều tia có tín hiệu lớn, vùng xương tín hiệu nhỏ; ảnh được đảo cực để xương hiển thị trắng.';
                case 6: return 'Ảnh X-quang hoàn chỉnh: xương trắng sáng (cản tia mạnh), mô mềm xám, phổi/khí và nền đen (cho tia đi qua). Đây là ảnh chiếu: mọi lớp mô chồng lên nhau theo hướng chùm tia. Dấu chữ L bằng chì cho biết bên trái của bệnh nhân.';
                default: return 'Quy trình: tạo tia X → chùm tia xuyên qua cơ thể và bị suy giảm khác nhau → đầu thu ghi nhận → xử lý thành ảnh chẩn đoán. Liều bức xạ được giữ thấp bằng cách chọn kVp/mAs phù hợp, lọc tia mềm và giới hạn trường chiếu.';
            }
        }

        function drawSpectrumHUD(x, y, w, h) {
            const kvp = KV[state.examRegion];
            hudPanel(x, y, w, h, `PHỔ TIA X (${kvp} kVp, lọc 2,5 mm Al)`, '#38bdf8');
            const px0 = x + 50, baseY = y + h - 66, pw = w - 76, ph = 150;
            const Emin = 10, Emax = kvp;
            const filt = E => Math.exp(-(3.4 * Math.pow(20 / E, 2.9) + 0.15) * 0.675);
            const cont = E => ((Emax - E) / E) * filt(E);
            let mx = 0;
            for (let E = Emin; E < Emax; E += 1) mx = Math.max(mx, cont(E));
            const xs = E => px0 + (E / Emax) * pw;
            const ys = v => baseY - (v / mx) * ph * 0.7;

            ctx.save();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(px0, baseY - ph); ctx.lineTo(px0, baseY); ctx.lineTo(px0 + pw, baseY);
            ctx.stroke();

            ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(xs(Emin), baseY);
            for (let E = Emin; E < Emax; E += 1) ctx.lineTo(xs(E), ys(cont(E)));
            ctx.lineTo(xs(Emax), baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            const hasK = kvp >= K_EDGE_W;
            if (hasK) {
                [[59.3, 0.5, 'Kα'], [67.2, 0.22, 'Kβ']].forEach(([E, amp, nm]) => {
                    const top = ys(cont(E)) - amp * ph * 0.7;
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(xs(E), ys(cont(E)));
                    ctx.lineTo(xs(E), top);
                    ctx.stroke();
                    ctx.fillStyle = '#d8b4fe';
                    ctx.font = 'bold 13px "JetBrains Mono", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(nm, xs(E), top - 6);
                });
            }
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            [0, Math.round(Emax / 2), Emax].forEach(E => ctx.fillText(E, xs(E), baseY + 16));
            ctx.fillText('Năng lượng photon (keV)', px0 + pw / 2, baseY + 32);
            ctx.textAlign = 'left';
            ctx.font = '600 13px "Inter", sans-serif';
            ctx.fillStyle = hasK ? '#d8b4fe' : '#fbbf24';
            ctx.fillText(hasK ? 'Có vạch đặc trưng K của W (59,3 và 67,2 keV)' : `kVp < 69,5 kV: KHÔNG có vạch đặc trưng K của vonfram`, x + 16, y + h - 12);
            ctx.restore();
        }

        function drawMechanismHUD(x, y, w, h) {
            hudPanel(x, y, w, h, 'CƠ CHẾ PHÁT XẠ TẠI BIA VONFRAM', '#38bdf8');
            ctx.save();
            const hasK = KV[state.examRegion] >= K_EDGE_W;
            ctx.textAlign = 'left';
            ctx.font = '500 14px "Inter", sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.beginPath(); ctx.arc(x + 26, y + 60, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('Electron gia tốc từ catốt (−) tới anốt (+)', x + 44, y + 65);
            drawXrayWavePhoton(x + 26, y + 92, 0, '#38bdf8', 1);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('Bức xạ hãm: phổ liên tục, có mặt ở mọi kVp', x + 56, y + 97);
            drawXrayWavePhoton(x + 26, y + 124, 0, '#a855f7', hasK ? 1 : 0.3);
            ctx.fillStyle = hasK ? '#cbd5e1' : '#64748b';
            ctx.fillText(hasK ? 'Bức xạ đặc trưng K (kVp > 69,5)' : 'Bức xạ đặc trưng K: chưa xuất hiện (kVp < 69,5)', x + 56, y + 129);

            ctx.fillStyle = '#e2e8f0';
            ctx.font = '600 13px "JetBrains Mono", monospace';
            ctx.fillText('Hiệu suất tạo tia X ≈ 1%, còn ≈ 99% thành nhiệt', x + 16, y + 160);
            ctx.fillStyle = '#f97316';
            ctx.fillRect(x + 16, y + 170, (w - 32) * 0.99, 10);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(x + w - 16 - (w - 32) * 0.01, y + 170, (w - 32) * 0.01, 10);
            ctx.restore();
        }

        function drawAttenuationHUD(x, y, w, h) {
            const chest = state.examRegion === 'CHEST';
            hudPanel(x, y, w, h, 'SUY GIẢM TIA X (BEER–LAMBERT)', '#38bdf8');
            ctx.save();
            ctx.textAlign = 'left';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('I = I₀ · e^(−∫ μ dx)', x + 20, y + 66);

            const rows = chest
                ? [['#e2e8f0', 'XƯƠNG: μ lớn → ít tia tới → ảnh TRẮNG'], ['#f43f5e', 'TIM, MÔ MỀM: μ vừa → ảnh XÁM'], ['#38bdf8', 'PHỔI (khí): μ nhỏ → nhiều tia → ảnh ĐEN']]
                : [['#e2e8f0', 'XƯƠNG: μ lớn → ít tia tới → ảnh TRẮNG'], ['#94a3b8', 'MÔ MỀM: μ vừa → ảnh XÁM'], ['#38bdf8', 'KHÔNG KHÍ: không suy giảm → ảnh ĐEN']];
            rows.forEach((r, i) => {
                ctx.fillStyle = r[0];
                ctx.fillRect(x + 20, y + 94 + i * 34, 16, 16);
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '600 14px "Inter", sans-serif';
                ctx.fillText(r[1], x + 46, y + 107 + i * 34);
            });
            ctx.font = '500 13.5px "Inter", sans-serif';
            ctx.fillStyle = '#94a3b8';
            const note = chest
                ? 'Ở 120 kVp hiệu ứng Compton chiếm ưu thế nên xương và mô mềm chênh lệch ít hơn, giúp nhìn thấy phổi qua xương sườn.'
                : 'Ở 55 kVp hiệu ứng quang điện (∝ Z³/E³) mạnh nên xương và mô mềm tương phản rất rõ.';
            wrapLines(note, w - 40).forEach((ln, i) => ctx.fillText(ln, x + 20, y + 214 + i * 20));
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('● quang điện: hấp thụ hoàn toàn', x + 20, y + h - 40);
            ctx.fillStyle = '#c4b5fd';
            ctx.fillText('● Compton: photon đổi hướng (tán xạ)', x + 20, y + h - 18);
            ctx.restore();
        }

        function drawHUD(scene) {
            ctx.save();
            if (scene === 3) {
                drawMechanismHUD(1400, 130, 480, 200);
                drawSpectrumHUD(1340, 690, 540, 270);
            }
            if (scene === 4) drawAttenuationHUD(50, 130, 470, 330);

            // Lời thuyết minh từng bước
            const bx = 60, by = 972, bw = 1800, bh = 96;
            ctx.fillStyle = 'rgba(10, 18, 36, 0.9)';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 14);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '500 19px "Inter", sans-serif';
            ctx.textAlign = 'left';
            wrapLines(getCaption(scene), bw - 40).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, bx + 20, by + 30 + i * 27));
            ctx.restore();

            // Mờ chuyển cảnh tại các mốc
            let fade = 0;
            [8, 16, 24, 32, 40, 48].forEach(b => {
                const d = Math.abs(state.time - b);
                if (d < 0.3) fade = Math.max(fade, (1 - d / 0.3) * 0.8);
            });
            if (fade > 0) {
                ctx.fillStyle = `rgba(2, 6, 23, ${fade})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
        }

        // ==================== VÒNG LẶP CHÍNH ====================
        let lastFrameTime = performance.now();
        let lastZoomText = '';

        function animate(now) {
            const rawDt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            const dt = Math.min(rawDt, 0.05);

            if (state.isPlaying) {
                state.time += dt * state.speed;
                if (state.autoMode) {
                    if (state.time >= state.totalDuration) state.time = 0;
                } else {
                    // Khóa cảnh: lặp lại trong phạm vi cảnh đang chọn
                    const sc = SCENES[(state.lockedScene || 1) - 1];
                    if (state.time >= sc.end) state.time = sc.start + (state.time - sc.end);
                }
            }

            document.getElementById('timelineFill').style.width = `${(state.time / state.totalDuration) * 100}%`;
            document.getElementById('timeCurrent').innerText = formatTime(state.time);

            const activeScene = SCENES.find(s => state.time >= s.start && state.time < s.end) || SCENES[SCENES.length - 1];
            if (activeScene.id !== state.currentScene) syncSceneUI();

            updateCamera(dt, false);
            const zt = `${camera.zoom.toFixed(2)}×`;
            if (zt !== lastZoomText) { lastZoomText = zt; document.getElementById('hudZoomVal').innerText = zt; }

            drawRoomBackdrop();

            const sceneProgress = clamp((state.time - activeScene.start) / (activeScene.end - activeScene.start));
            const activeDt = state.isPlaying ? dt * state.speed : 0;

            ctx.save();
            ctx.translate(WIDTH / 2, HEIGHT / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);
            switch (activeScene.id) {
                case 1: renderRoomScene(false); break;
                case 2: renderXrayTubeScene(sceneProgress, false, activeDt); break;
                case 3: renderXrayTubeScene(sceneProgress, true, activeDt); break;
                case 4: renderScene4(sceneProgress, activeDt); break;
                case 5: renderScene5(sceneProgress); break;
                case 6: renderScene6(sceneProgress); break;
                case 7: renderRoomScene(true); break;
            }
            ctx.restore();

            drawHUD(activeScene.id);

            // Chữ tiêu đề cảnh cuối
            if (activeScene.id === 7) {
                ctx.save();
                ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
                ctx.beginPath();
                ctx.roundRect(WIDTH / 2 - 280, 125, 560, 74, 16);
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 30px "Inter", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText("TẠO ẢNH BẰNG TIA X", WIDTH / 2, 172);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => {
            fitStage();
            initTubeParticles();
            buildRadiographs();
            buildRays();
            syncSceneUI();
            updateAutoUI();
            updatePlayPauseUI();
            updateCamera(0, true);
            requestAnimationFrame(animate);
            // Dựng lại ảnh offscreen khi font Inter đã tải để chữ "L" đúng font
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildRadiographs);
        });
    </script>
